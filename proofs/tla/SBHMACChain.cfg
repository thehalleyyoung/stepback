\* TLC Model Checker configuration for SBHMACChain.tla
\*
\* Run from the proofs/tla/ directory:
\*   tlc SBHMACChain -config SBHMACChain.cfg
\*
\* TLC will check all three invariants on the bounded state space:
\*   MaxFrames=3, |Bodies|=3, one abstract HMAC key.
\* Expected result: no invariant violations (all 3 properties hold).
\*
\* To widen the state space for deeper verification, increase MaxFrames
\* and/or add more model values to Bodies.  Running with MaxFrames=5 and
\* |Bodies|=4 is tractable on a modern laptop.

SPECIFICATION Spec

CONSTANTS
    MaxFrames = 3
    Bodies    = {b1, b2, b3}
    HMACKey   = hmac_key_1

INVARIANT IntegrityInvariant
INVARIANT TamperEvidenceInvariant
INVARIANT WriterCoherenceInvariant
