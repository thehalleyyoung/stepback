[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "stepback-core"
version = "0.1.0"
description = "Experimental Rust acceleration for the stepback verifier (PyO3 binding to sb-verify)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["stepback", "sb-trace", "verifier", "pyo3"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/stepback-dev/stepback"
Source = "https://github.com/stepback-dev/stepback"
Issues = "https://github.com/stepback-dev/stepback/issues"

[tool.maturin]
# We ship the public Python surface from `python/stepback_core/__init__.py`
# alongside the native `_stepback_core` extension module. This keeps the
# user-facing Python API stable while we iterate on the Rust internals.
python-source = "python"
module-name = "stepback_core._stepback_core"
features = ["pyo3/extension-module"]
