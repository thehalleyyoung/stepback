name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest · Py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q --tb=short --maxfail=5

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Inspect dist
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

  coverage-floors:
    name: coverage floors · load-bearing modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests under coverage
        run: |
          coverage run -m pytest -q --tb=short --maxfail=10

      - name: Emit coverage JSON
        run: coverage json -o coverage.json

      - name: Enforce per-module floors (Step 26)
        run: python scripts/check_coverage_floors.py

      - name: Upload raw coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.json
            .coverage
          retention-days: 90
          if-no-files-found: warn

  jvm:
    name: gradle test · JVM bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Gradle build + test
        working-directory: bindings/jvm
        run: gradle --no-daemon build

  wasm:
    name: cargo test · sb-wasm + wasm-pack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version ^0.13
      - name: Host-target unit tests for sb-wasm
        working-directory: stepback-core
        run: cargo test -p sb-wasm
      - name: Build wasm bundles (web, bundler, nodejs)
        run: ./scripts/build_wasm.sh
      - name: Upload wasm bundles
        uses: actions/upload-artifact@v4
        with:
          name: stepback-wasm-${{ github.sha }}
          path: |
            wasm/pkg/
            wasm/pkg-bundler/
            wasm/pkg-nodejs/

  api-compat:
    name: API + SB-Trace schema compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so --auto-baseline-ref can locate the
          # most recent v* release tag. fetch-tags is a belt-and-braces.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Diff public API + SB-Trace schema against last release tag
        run: |
          python scripts/check_api_compat.py \
              --auto-baseline-ref \
              --out api-compat-snapshots

      - name: Emit machine-readable JSON report
        if: always()
        run: |
          python scripts/check_api_compat.py \
              --auto-baseline-ref \
              --json \
              > api-compat-report.json || true

      - name: Upload current snapshots and diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compat-${{ github.sha }}
          path: |
            api-compat-snapshots/
            api-compat-report.json
          if-no-files-found: warn

